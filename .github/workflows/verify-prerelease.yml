name: Verify published signed prerelease
on:
  push:
    branches: [miyako-text-to-svg-implementation]

permissions:
  contents: read

jobs:
  published:
    if: >-
      github.repository == 'miyako/Text-to-SVG' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/miyako-text-to-svg-implementation' &&
      contains(github.event.head_commit.message, '[verify-prerelease]')
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a89cdde65e380263963de688a773a5bcc9b71561
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact checksum-verified free compiler
        run: python scripts/ci_config.py download-tool4d
      - name: Download public prerelease and load its exact compiled ZIP
        shell: python
        run: |
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from build_provenance import commit
          from ci_config import load_config
          from package_component import unpack_for_test
          from release_assets import verify_assets, verify_signed_payload
          from release_ref import verify
          from sign_release import Commands, signature
          from test_4d import test_4d

          root = Path.cwd()
          sha = "a89cdde65e380263963de688a773a5bcc9b71561"
          tag = "v0.1.0"
          if commit(root) != sha:
              raise ValueError("published source checkout mismatch")
          verify(root, tag, sha)
          api = subprocess.run(
              ["curl", "--fail", "--silent", "--show-error", "--proto", "=https",
               "https://api.github.com/repos/miyako/Text-to-SVG/releases/tags/" + tag],
              check=True, capture_output=True, timeout=60)
          release = json.loads(api.stdout)
          if (release["draft"] is not False or release["prerelease"] is not True
                  or release["tag_name"] != tag or release["target_commitish"] != sha):
              raise ValueError("public prerelease flags/source mismatch")
          expected = {
              "Text-to-SVG.zip": "a4c096a95a1e8c90f04eda3f4ea3488f47958a06109cfc2b781e8156615d547e",
              "Text-to-SVG.dmg": "42f91f8c87156af6e9ddff64acc10b29ba57987cdab3c7024ae5f0b563d7b104",
              "Text-to-SVG-signing.json": "c79392881338b9614f55a0390ac006660185ea156a04dbaaf76dbc8415a8de0f",
              "Text-to-SVG.acceptance.json": "c3d0eee67f99f48c2b27ea03a054329f89f7a10d271a92f079b7912008e87663",
          }
          dist = root / "dist"
          dist.mkdir()
          for name, digest in expected.items():
              entry = next(asset for asset in release["assets"] if asset["name"] == name)
              url = "https://github.com/miyako/Text-to-SVG/releases/download/" + tag + "/" + name
              if entry["browser_download_url"] != url:
                  raise ValueError("public download URL mismatch")
              path = dist / name
              subprocess.run(
                  ["curl", "--fail", "--location", "--silent", "--show-error",
                   "--proto", "=https", "--proto-redir", "=https",
                   "--output", str(path), url], check=True, capture_output=True, timeout=180)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if (actual != digest or entry["digest"] != "sha256:" + actual
                      or entry["size"] != path.stat().st_size):
                  raise ValueError("public asset byte mismatch")
          verify_assets(root, "miyako/Text-to-SVG", tag, sha, True)
          config = load_config(root, initialized=True)
          component = unpack_for_test(root, dist / "Text-to-SVG.zip")
          signatures = verify_signed_payload(root, config, component)
          commands = Commands(os.environ, {})
          for entry in signatures["signedFiles"]:
              commands.run("published code notarization", [
                  "/usr/bin/codesign", "--verify", "--strict", "--all-architectures",
                  "--check-notarization", "-R=notarized", component / entry["path"]])
          dmg = dist / "Text-to-SVG.dmg"
          signature(commands, dmg, signatures["team"], runtime=False)
          commands.run("published DMG staple", ["/usr/bin/xcrun", "stapler", "validate", dmg])
          commands.run("published DMG Gatekeeper", [
              "/usr/sbin/spctl", "--assess", "--verbose=4", "--type", "open",
              "--context", "context:primary-signature", dmg])
          status = test_4d(root, root / ".tools/tool4d.app/Contents/MacOS/tool4d", component)
          report = {
              "schema": 1, "source_sha": sha, "tag": tag, "release": release["html_url"],
              "prerelease": True, "anonymous_public_asset_hashes": expected,
              "checks": {name: "passed" for name in (
                  "public_downloads", "source_tag", "acceptance", "native_signatures",
                  "online_notarization", "dmg_signature", "dmg_staple", "dmg_gatekeeper",
                  "public_compiled_host")},
              "compiled_host": status, "release_ready": False,
              "not_run": ["native_intel_4d", "windows_4d", "interactive_dependency_manager_install"],
          }
          (root / "build/public-prerelease-verification.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
      - name: Retain actual public-download verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-prerelease-verification
          path: |
            build/public-prerelease-verification.json
            build/host-status.json
          if-no-files-found: warn
          retention-days: 30
