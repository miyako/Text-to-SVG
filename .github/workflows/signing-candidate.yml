name: Verify signed candidate without publication
on:
  push:
    branches: [miyako-text-to-svg-implementation]

permissions:
  contents: read

concurrency:
  group: signed-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.repository == 'miyako/Text-to-SVG' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/miyako-text-to-svg-implementation' &&
      contains(github.event.head_commit.message, '[signed-candidate]')
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.inputs.outputs.source_sha }}
      version_tag: ${{ steps.inputs.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: inputs
        name: Bind candidate to immutable checked-out inputs
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, "scripts")
          from build_provenance import commit
          from ci_config import load_config
          config = load_config(initialized=True, repository=os.environ["GITHUB_REPOSITORY"])
          sha = commit(".")
          if sha != os.environ["GITHUB_SHA"]:
              raise SystemExit("candidate checkout does not match the push revision")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("source_sha=" + sha + "\n")
              output.write("version_tag=v" + config["version"] + "\n")

  candidate:
    needs: gate
    uses: ./.github/workflows/signed-build.yml
    with:
      source_sha: ${{ needs.gate.outputs.source_sha }}
      version_tag: ${{ needs.gate.outputs.version_tag }}
      candidate: true
    secrets:
      APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
      NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
      NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
