name: Publish
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump from the latest release tag
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Publish only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Publish from the main branch"
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute next version and update version files
        id: bump
        env:
          MODE: ${{ inputs.mode }}
        run: python scripts/bump_version.py --mode "$MODE" --write
      - name: Commit version to main
        id: commit
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release $VERSION"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  native:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  build:
    needs: [version, native]
    runs-on: macos-15
    env:
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
      RELEASE_TAG: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-x64
          path: build/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-arm64
          path: build/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows-x64
          path: build/windows-x64
      - name: Download exact checksum-verified free compiler
        run: python scripts/ci_config.py download-tool4d
      - name: Compile, codesign, notarize and host-test the final package
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
        run: >-
          python scripts/accept_hosted.py --root . --repository "$GITHUB_REPOSITORY"
          --tool4d .tools/tool4d.app/Contents/MacOS/tool4d --tag "$RELEASE_TAG"
          --require-apple-signing
      - name: Verify final signed assets
        run: >-
          python scripts/release_assets.py --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --require-apple-signing
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-release
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*-signing.json
            dist/*.acceptance.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain redacted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-diagnostics
          path: |
            build/hosted-acceptance.json
            build/source-host-status.json
            build/compile-status.json
            build/unsigned-compiled-host-status.json
            build/compiled-host-status.json
            build/host-status.json
            build/signing-diagnostics/
          if-no-files-found: warn
          retention-days: 30
      - name: Always remove isolated signing credentials and keychain
        if: always()
        run: python scripts/sign_release.py cleanup --root .

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: compiled-release
          path: dist
      - name: Create tag and GitHub release with the signed ZIP and DMG
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.version }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
        run: >-
          python scripts/release_assets.py --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --require-apple-signing --publish
