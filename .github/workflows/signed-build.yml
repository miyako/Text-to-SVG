name: Build and verify signed component
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version_tag:
        type: string
        required: true
      candidate:
        type: boolean
        default: false
    secrets:
      APPLE_DEVELOPER_ID_CERTIFICATE:
        required: true
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      NOTARYTOOL_APPLE_ID:
        required: true
      NOTARYTOOL_PASSWORD:
        required: true
      NOTARYTOOL_TEAM_ID:
        required: true

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      release_call: true

  signed:
    needs: native
    if: >-
      github.repository == 'miyako/Text-to-SVG' &&
      github.event_name != 'pull_request' &&
      github.event_name != 'pull_request_target' &&
      ((inputs.candidate && github.event_name == 'push' &&
        github.ref == 'refs/heads/miyako-text-to-svg-implementation' &&
        contains(github.event.head_commit.message, '[signed-candidate]')) ||
       (!inputs.candidate && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')))
    runs-on: macos-15
    env:
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.version_tag }}
      CANDIDATE_MODE: ${{ inputs.candidate && 'true' || 'false' }}
      CANDIDATE_REF: refs/heads/miyako-text-to-svg-implementation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-x64
          path: build/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-arm64
          path: build/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows-x64
          path: build/windows-x64
      - name: Download exact checksum-verified free compiler
        run: python scripts/ci_config.py download-tool4d
      - name: Compile, sign, notarize and host-test the final candidate
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
        run: >-
          python scripts/accept_hosted.py --root . --repository "$GITHUB_REPOSITORY"
          --tool4d .tools/tool4d.app/Contents/MacOS/tool4d --tag "$RELEASE_TAG"
          --require-apple-signing
      - name: Verify completed final-byte acceptance before upload
        run: >-
          python scripts/release_assets.py --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --require-apple-signing
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-release
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*-signing.json
            dist/*.acceptance.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain redacted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-acceptance-diagnostics
          path: |
            build/hosted-acceptance.json
            build/source-host-status.json
            build/compile-status.json
            build/unsigned-compiled-host-status.json
            build/compiled-host-status.json
            build/host-status.json
            build/signing-diagnostics/
          if-no-files-found: warn
          retention-days: 30
      - name: Always remove isolated signing credentials and keychain
        if: always()
        run: python scripts/sign_release.py cleanup --root .
