name: Release compiled component
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: Existing matching version tag; never creates a tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.release_ref.outputs.sha }}
      release_tag: ${{ steps.release_ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve existing version tag to an immutable commit
        id: release_ref
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: >-
          python scripts/release_ref.py resolve
          --event "$GITHUB_EVENT_NAME" --ref-type "$GITHUB_REF_TYPE"
          --ref-name "$GITHUB_REF_NAME" --version-tag "$VERSION_TAG"
          --event-sha "$GITHUB_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_ref.outputs.sha }}
      - name: Require initialized repository, version, 4D opt-in and signing policy
        env:
          FOURD_ENABLED: ${{ vars.FOURD_ENABLED }}
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: |
          python scripts/ci_config.py validate --release --tag "$RELEASE_TAG"
          python scripts/sign_release.py policy --require-apple-signing

  build:
    needs: gate
    uses: ./.github/workflows/signed-build.yml
    with:
      source_sha: ${{ needs.gate.outputs.source_sha }}
      version_tag: ${{ needs.gate.outputs.release_tag }}
      candidate: false
    secrets:
      APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
      NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
      NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}

  publish:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: compiled-release
          path: dist
      - name: Publish only the accepted signed bytes after rechecking the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.gate.outputs.source_sha }}
        run: |
          git fetch --force --no-tags origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          python scripts/release_ref.py verify --tag "$RELEASE_TAG" --expected-sha "$RELEASE_SHA"
          python scripts/release_assets.py --repository "$GH_REPO" --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" --require-apple-signing --publish
